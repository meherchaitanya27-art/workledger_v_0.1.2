<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B6B">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WorkLedger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>WorkLedger</title>
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#16212C;--mute:#5B6874;--rule:#DDE3E9;--acc:#0E6B6B;--accd:#0A5252;--accl:#DDEEEE;
--amb:#C27A0E;--we:#2F5D9E;--bad:#B3261E;--c-reg:#0D9488;--c-ot:#C27A0E;--c-we:#2F5D9E;--sl:#5A7184;--tab:62px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto}
#top{position:sticky;top:0;z-index:20;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 16px 8px}
#top .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
#top h1{margin:0;font-size:22px;font-weight:650;letter-spacing:.1px}
.pill{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mute);min-height:34px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill i{width:8px;height:8px;border-radius:50%;background:#C4CDD6;display:inline-block}
.pill.ok i{background:var(--c-reg)}.pill.warn i{background:var(--amb)}.pill.bad i{background:var(--bad)}
.pill.busy i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
#periodbar{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
#periodbar[hidden],#custom[hidden]{display:none}
#custom{display:flex;gap:6px}
select,input,textarea{font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff;border:1px solid #C4CDD6;border-radius:10px;padding:10px 12px;min-height:44px;min-width:0;max-width:100%}
select:focus-visible,input:focus-visible,button:focus-visible,.hit:focus-visible{outline:2px solid #4FB3B3;outline-offset:2px}
#showing{margin:6px 2px 0;color:var(--mute);font-size:13px}
main{padding:6px 16px calc(var(--tab) + 110px + env(safe-area-inset-bottom))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.span2{grid-column:1/-1}
.card,.kpi{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px;position:relative;min-width:0}
.card h2{margin:0 0 10px;font-size:15px;font-weight:650}
.kt{color:var(--mute);font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:22px}
.kv{font-size:23px;font-weight:650;margin:2px 0 1px;overflow-wrap:anywhere}
.ks{color:var(--mute);font-size:12.5px;line-height:1.3}
.kpi.hero{background:var(--acc);border-color:var(--acc);color:#fff;padding:16px}
.kpi.hero .kt,.kpi.hero .ks{color:#CFE8E8}
.kpi.hero .kv{font-size:48px;line-height:1.1;margin:4px 0 6px;letter-spacing:-.5px}
.kpi.ot{box-shadow:inset 5px 0 0 var(--c-ot)}.kpi.we{box-shadow:inset 5px 0 0 var(--c-we)}
.kpi.ot,.kpi.we{overflow:hidden}
.kpi.off .kv{color:#A3ADB8}.kpi.off .kt>span:first-child{color:#8A96A3}
.sw{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.sw input{position:absolute;inset:-8px -6px;width:calc(100% + 12px);height:calc(100% + 16px);opacity:0;margin:0;cursor:pointer;min-height:0;padding:0}
.sw span{position:absolute;inset:0;background:#C4CDD6;border-radius:11px;transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span::after{transform:translateX(16px)}
.sw input:focus-visible+span{outline:2px solid #4FB3B3;outline-offset:2px}
.mv{display:flex;gap:6px;margin-top:10px}
.mv button{flex:1;border:1px dashed var(--acc);background:#F3F9F9;color:var(--accd);border-radius:8px;padding:6px;min-height:36px;cursor:pointer}
.editbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:2px 0 10px}
.editbar p{margin:0;color:var(--mute);font-size:13px}
.b{border:1px solid #C4CDD6;background:#fff;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.b.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.b.del{color:var(--bad);border-color:#E3B7B3}
.b.sm{min-height:36px;padding:6px 12px;font-size:14px}
.b:disabled{opacity:.55}
.empty{color:var(--mute);margin:6px 0}
.hist{border:1px solid var(--rule);border-radius:12px;overflow:hidden;font-size:13.5px}
.hrow{padding:9px 12px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:2px}
.hrow:first-child{border-top:0}
.hrow span{color:var(--mute);font-size:12.5px}
.hrow b{font-weight:500}
.banner{background:#FFF6E3;border:1px solid #EBCB8B;border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
/* calendar */
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-h h2{flex:1;margin:0}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow span{text-align:center;font-size:11.5px;color:#8A96A3;padding:2px 0}
.day{border:0;background:transparent;border-radius:9px;min-height:44px;padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;position:relative;font-size:14px;color:var(--ink)}
.day small{font-size:10px;line-height:1.1;opacity:.95}
.day.out{color:#B4BEC8}
.day.pp{background:#E3F1F1}
.day.w{background:var(--c-reg);color:#fff}.day.w.o{background:var(--c-ot)}.day.w.e{background:var(--c-we)}
.day.t{box-shadow:inset 0 0 0 2px var(--ink)}
.day.pd::after{content:"$";position:absolute;top:1px;right:4px;font-size:10px;font-weight:700;color:var(--amb)}
.day.w.pd::after{color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;color:var(--mute);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#5B6874}
.chart .val{fill:var(--ink);font-weight:600}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover,.chart .hit.sel{fill:rgba(14,107,107,.08)}
.readout{min-height:20px;margin:6px 0 0;font-size:13px;color:var(--ink)}
.hb{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;margin:9px 0;font-size:13.5px}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb i{display:block;height:10px;border-radius:0 4px 4px 0;background:var(--sl)}
.linkbtn{border:0;background:none;color:var(--acc);font-weight:600;padding:8px 0;min-height:36px;cursor:pointer}
/* lists */
.sumbar{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.sumbar b{font-weight:650}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{width:100%;text-align:left;border:1px solid var(--rule);background:#fff;border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;cursor:pointer;min-height:62px}
.row .dt{text-align:center;line-height:1.1}.row .dt b{display:block;font-size:20px}.row .dt span{font-size:12px;color:var(--mute)}
.row .t1{font-weight:600}.row .t2{color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.row .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row .rt b{font-weight:650}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;background:var(--accl);color:var(--accd)}
.tag.ot{background:#F8EBD3;color:#8A5200}.tag.we{background:#DCE6F5;color:#234A85}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer .tv{font-size:26px;font-weight:650;min-width:130px}
/* settings */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);min-width:0}
.fl small{color:#8A96A3}
.fl.chk{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px}
.fl.chk input{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--acc)}
.help{color:var(--mute);font-size:13px;margin:8px 0 0}
.hint{color:var(--mute);font-size:13px;margin:10px 0 0;min-height:18px}
.err{color:var(--bad);font-size:13.5px;margin:8px 0 0;min-height:0}
.st{margin:10px 0 0;font-size:13.5px}
.st.ok{color:#0A6B5F}.st.bad{color:var(--bad)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns .b{flex:1;min-width:110px}
.steps{margin:6px 0 0;padding-left:20px;color:var(--ink);font-size:14px}
.steps li{margin:4px 0}
/* chrome */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabs button{border:0;background:none;padding:8px 0 6px;min-height:var(--tab);display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:11.5px;cursor:pointer}
#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--acc);font-weight:650}
#fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(var(--tab) + 16px + env(safe-area-inset-bottom));z-index:25;border:0;background:var(--acc);color:#fff;border-radius:999px;padding:0 20px;min-height:52px;font-weight:650;box-shadow:0 6px 18px rgba(14,107,107,.35);cursor:pointer;font-size:15px}
#fab[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + 80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:70;max-width:min(92vw,520px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;font-size:14px}
#toast.on{opacity:1}
.back{position:fixed;inset:0;background:rgba(22,33,44,.45);z-index:50;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:92dvh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));z-index:51;animation:up .22s ease-out;outline:0}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#D0D7DE;margin:4px auto 10px}
.sheet h2{margin:0 0 12px;font-size:18px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="bar"><h1>WorkLedger</h1><button id="syncpill" class="pill" type="button"></button></div>
    <div id="periodbar">
      <select id="period" aria-label="Period"></select>
      <span id="custom" hidden><input type="date" id="pf" aria-label="From"><input type="date" id="pt" aria-label="To"></span>
    </div>
    <p id="showing"></p>
  </header>
  <main id="view"></main>
</div>
<nav id="tabs" aria-label="Sections"><div class="in">
  <button data-tab="dash" type="button"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="8" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.5"/></svg>Dashboard</button>
  <button data-tab="hours" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Hours</button>
  <button data-tab="exp" type="button"><svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8.5h6M9 12h6"/></svg>Expenses</button>
  <button data-tab="more" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.4M12 18.1v2.4M3.5 12h2.4M18.1 12h2.4M6 6l1.7 1.7M16.3 16.3 18 18M6 18l1.7-1.7M16.3 7.7 18 6"/></svg>Settings</button>
</div></nav>
<button id="fab" type="button" hidden></button>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ================================================================
   WorkLedger phone app. Same pay rules as the Windows app.
   Data lives only on this phone (localStorage); sync merges by record id.
   ================================================================ */
const KEY = 'workledger.mobile.v1';
const INC_KEYS = ['reg', 'ot', 'we', 'tax', 'gas', 'acc'];
const CATS = ['Fuel', 'Meals', 'Lodging', 'Parking and tolls', 'Vehicle maintenance', 'Tools and equipment', 'Safety gear (PPE)',
  'Uniform and clothing', 'Phone and internet', 'Software', 'Supplies', 'Training', 'Travel and transport', 'Other'];
const DEF_S = { name: '', cur: '$', rate: 25, ot: 0, otd: 8, otm: 1.5, wm: 2, tax: 20, brk: 30, gas: 0.7, dmi: 0, acc: 40, ppd: 5, v: 2 };
const DEF_INC = { reg: true, ot: true, we: true, tax: true, gas: true, acc: true };
const CARD_KEYS = ['total', 'hours', 'reg', 'gross', 'ot', 'we', 'tax', 'net', 'gas', 'acc', 'exp', 'pay', 'cal', 'chart_h', 'chart_c'];
const SPAN2 = new Set(['total', 'pay', 'cal', 'chart_h', 'chart_c']);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const PERIODS = [['pp', 'Current pay period'], ['lpp', 'Last pay period'], ['week', 'This week'], ['lweek', 'Last week'],
  ['month', 'This month'], ['lmonth', 'Last month'], ['year', 'This year'], ['all', 'All time'], ['custom', 'Custom range']];

let db = null;
let _today = null;

/* ---------------- dates (ISO strings, UTC arithmetic so DST never shifts a day) ---------------- */
const pad = n => String(n).padStart(2, '0');
function parseISO(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
  if (!m) return null;
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3] ? d : null;
}
const iso = d => d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
const addDays = (s, n) => { const d = parseISO(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const wd = s => (parseISO(s).getUTCDay() + 6) % 7;            // Monday = 0
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const monthStart = s => s.slice(0, 8) + '01';
const monthEnd = s => { const d = parseISO(s); return iso(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0))); };
function localToday() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const today = () => _today || localToday();
function niceDate(s) { const d = parseISO(s); return DOW[wd(s)] + ' ' + pad(d.getUTCDate()) + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
function shortDate(s) { const d = parseISO(s); return pad(d.getUTCDate()) + ' ' + MON[d.getUTCMonth()]; }

/* ---------------- formatting ---------------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function money(v) { const cur = db && db.s ? db.s.cur : '$'; return cur + Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function dur(h) { const m = Math.round(h * 60); return Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm'; }
const g1 = v => +Number(v).toFixed(1);
function niceCeil(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.2, 1.6, 2, 2.4, 3, 4, 5, 6, 8, 10]) if (v <= m * e) return m * e; return 10 * e; }
function ago(ms) {
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return Math.round(s / 86400) + ' d ago';
}

/* ---------------- pay rules (mirror of the Windows app) ---------------- */
function minutes(e) {
  const a = e.start.split(':'), b = e.end.split(':');
  let d = (+b[0] * 60 + +b[1]) - (+a[0] * 60 + +a[1]);
  if (d < 0) d += 1440;
  return Math.max(0, d - (+e.brk || 0));
}
/* Weekend hours: weekend multiplier, never overtime. Weekday hours over the daily limit are overtime first;
   the remaining regular hours then count toward the weekly limit (Monday to Sunday week). */
function calc(x) {
  const s = x.s, out = {}, cum = {}, dcum = {};
  const thr = s.ot > 0 ? s.ot : Infinity;
  const dthr = (s.otd || 0) > 0 ? s.otd : Infinity;
  const list = [...x.e].sort((a, b) => { const ka = a.date + '|' + a.start + '|' + a.id, kb = b.date + '|' + b.start + '|' + b.id; return ka < kb ? -1 : ka > kb ? 1 : 0; });
  for (const e of list) {
    const h = minutes(e) / 60, we = wd(e.date) >= 5;
    let reg, wk, ot;
    if (we) { reg = 0; wk = h; ot = 0; }
    else {
      const dprev = dcum[e.date] || 0;
      const dReg = Math.max(0, Math.min(h, dthr - dprev));
      dcum[e.date] = dprev + h;
      const k = addDays(e.date, -wd(e.date));
      const prev = cum[k] || 0;
      reg = Math.max(0, Math.min(dReg, thr - prev));
      cum[k] = prev + dReg;
      wk = 0; ot = h - reg;
    }
    const mi = +e.miles || 0;
    out[e.id] = { h, reg, wk, ot, we, mi, gas: mi * s.gas, reg_pay: reg * s.rate, wk_pay: wk * s.rate * s.wm, ot_pay: ot * s.rate * s.otm,
      pay: reg * s.rate + wk * s.rate * s.wm + ot * s.rate * s.otm };
  }
  return out;
}
function summary(x, c, rows) {
  const s = x.s, inc = x.inc || {};
  const on = k => inc[k] !== false;
  const r = { h: 0, reg: 0, wk: 0, ot: 0, gross: 0, mi: 0, gas: 0 };
  const days = new Set();
  for (const e of rows) {
    const k = c[e.id];
    r.h += k.h; r.reg += k.reg; r.wk += k.wk; r.ot += k.ot; r.gross += k.pay; r.mi += k.mi; r.gas += k.gas; days.add(e.date);
  }
  r.days = days.size;
  r.reg_pay = r.reg * s.rate; r.wk_pay = r.wk * s.rate * s.wm; r.ot_pay = r.ot * s.rate * s.otm;
  r.acc = days.size * s.acc;
  r.gross_all = r.gross;
  r.reg_c = on('reg') ? r.reg_pay : 0; r.wk_c = on('we') ? r.wk_pay : 0; r.ot_c = on('ot') ? r.ot_pay : 0;
  r.gross = r.reg_c + r.wk_c + r.ot_c;
  r.tax_calc = r.gross * s.tax / 100;
  r.tax = on('tax') ? r.tax_calc : 0;
  r.net = r.gross - r.tax;
  r.gas_c = on('gas') ? r.gas : 0; r.acc_c = on('acc') ? r.acc : 0;
  r.allow = r.gas_c + r.acc_c;
  r.total = r.net + r.allow;
  return r;
}
/* Pay periods: the 1st to the 15th, and the 16th to month end. */
function halfBounds(s) { const ms = monthStart(s); return +s.slice(8) <= 15 ? [ms, s.slice(0, 8) + '15'] : [s.slice(0, 8) + '16', monthEnd(s)]; }

}
function pcBase() {
  const u = (db.sync.url || '').trim();
  if (u) return u.replace(/\/+$/, '');
  return location.protocol === 'http:' || location.protocol === 'https:' ? location.origin : '';
}
async function syncNow(quiet) {
  if (syncState === 'busy') return;
  const base = pcBase(), code = db.sync.code || '';
  const fail = m => { db.sync.ok = false; db.sync.failAt = Date.now(); db.sync.msg = m; syncState = 'idle'; save(); render(); if (!quiet) toast(m); return false; };
  if (!base) { db.sync.ok = false; db.sync.failAt = Date.now(); db.sync.msg = 'Enter your PC address first.'; save(); render(); return false; }
  if (!/^\d{6}$/.test(code)) { db.sync.ok = false; db.sync.failAt = Date.now(); db.sync.msg = 'Enter the 6-digit pairing code shown on the PC.'; save(); render(); if (!quiet) toast(db.sync.msg); return false; }
  // A secure (https) page cannot call the PC's http address directly. Go through a small page served by the PC instead.
  // The popup must be opened right here, while the tap that started the sync is still fresh.
  const viaBridge = location.protocol === 'https:' && /^http:/i.test(base);
  let win = null;
  if (viaBridge) {
    win = window.open(base + '/bridge', 'wl-bridge');
    if (!win) return fail('Pop-ups are blocked. Allow pop-ups for this site, then try again.');
  }
  syncState = 'busy'; render();
  try {
    let status, j;
    if (viaBridge) ({ status, body: j } = await bridgeCall(win, base, code, bundle(true)));

      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 15000);

    }
    if (status === 401 || status === 429) return fail(j.error || 'The pairing code was not accepted.');
    if (status !== 200 || !j.data) return fail(j.error || 'The PC could not complete the sync.');

  } catch (e) {
    return fail(e.name === 'AbortError' ? 'The PC did not answer in time.' : 'Cannot reach the PC. Check that this phone is on the same Wi-Fi, that WorkLedger is open on the PC and Phone sync is started, and that the address and code are right.');

/* Talks to the PC through the popup page at <PC>/bridge using postMessage (works from an https page). */
function bridgeCall(win, base, code, data) {
  const origin = new URL(base).origin, id = uid();
  return new Promise((resolve, reject) => {
    let sent = false, done = false;
    const finish = (fn, v) => { if (done) return; done = true; clearTimeout(t1); clearTimeout(t2); window.removeEventListener('message', on); try { win.close(); } catch (e) { /* ignore */ } fn(v); };
    const on = ev => {
      if (ev.origin !== origin || ev.source !== win || !ev.data) return;
      if (ev.data.type === 'wl-ready' && !sent) { sent = true; clearTimeout(t1); win.postMessage({ type: 'wl-sync', id, code, data }, origin); }
      else if (ev.data.type === 'wl-result' && ev.data.id === id) ev.data.error ? finish(reject, new Error('net')) : finish(resolve, { status: ev.data.status, body: ev.data.body || {} });
    };
    const t1 = setTimeout(() => finish(reject, new Error('net')), 12000);
    const t2 = setTimeout(() => finish(reject, Object.assign(new Error('slow'), { name: 'AbortError' })), 40000);

}
async function pcReachable() {
  const base = pcBase(); if (!base) return false;
  try { const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 2500); const r = await fetch(base + '/api/ping', { signal: ctl.signal, cache: 'no-store' }); clearTimeout(t); const j = await r.json(); return !!(j && j.app === 'WorkLedger'); }
  catch (e) { return false; }
}
async function shareFile() {
  const json = JSON.stringify(bundle(false), null, 1), name = 'workledger-phone.json';
  const file = new File([json], name, { type: 'application/json' });
  const saved = () => { db.sync.expAt = Date.now(); db.sync.ok = true; markAll(); save(); render(); };
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: 'WorkLedger phone file' }); saved(); toast('Shared ' + name); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); saved(); toast(name + ' saved to your downloads');
}

/* ---------------- sheets ---------------- */
function openSheet(title, body, onMount) {
  closeSheet();
  const root = $('#sheet-root');
  root.innerHTML = `<div class="back" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1"><div class="grab"></div><h2>${esc(title)}</h2>${body}</div>`;
  document.body.classList.add('lock');
  const sh = $('.sheet', root); sh.focus({ preventScroll: true });
  if (onMount) onMount(sh);
}
function closeSheet() { $('#sheet-root').innerHTML = ''; document.body.classList.remove('lock'); }

/* ---------------- main render + events ---------------- */
function render() {
  renderHeader();
  const v = $('#view'), y = window.scrollY, t = db.ui.tab;
  v.innerHTML = t === 'dash' ? dashHTML() : t === 'hours' ? hoursHTML() : t === 'exp' ? expHTML() : moreHTML();
  if (t === 'more') bindMore();
  window.scrollTo(0, y);
  updTimer();
}
function go(tab) { db.ui.tab = tab; db.ui.edit = false; save(); render(); window.scrollTo(0, 0); }
function updTimer() { const el = $('#tv'); if (!el || !db.timer) return; const s = Math.floor((Date.now() - db.timer) / 1000); el.textContent = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); }

function init() {
  db = loadDB();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) go(b.dataset.tab); });
  $('#fab').addEventListener('click', () => db.ui.tab === 'exp' ? openExp() : openEntry());
  $('#syncpill').addEventListener('click', () => { if (/^\d{6}$/.test(db.sync.code) && pcBase()) syncNow(false); else go('more'); });
  $('#period').addEventListener('change', e => { db.ui.p = e.target.value; if (db.ui.p === 'custom' && !(parseISO(db.ui.pf) && parseISO(db.ui.pt))) { const [a, b] = payPeriod(db.s, 0); db.ui.pf = a; db.ui.pt = b; } save(); render(); });
  $('#pf').addEventListener('change', e => { db.ui.pf = e.target.value; save(); render(); });
  $('#pt').addEventListener('change', e => { db.ui.pt = e.target.value; save(); render(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('[data-close]')) return closeSheet();
    let el;
    if ((el = t.closest('[data-edit-e]'))) { const id = el.dataset.editE; return openEntry(id); }
    if ((el = t.closest('[data-edit-x]'))) return openExp(el.dataset.editX);
    if ((el = t.closest('[data-add-day]'))) return openEntry(null, el.dataset.addDay);
    if ((el = t.closest('[data-day]'))) return openDay(el.dataset.day);
    if ((el = t.closest('[data-cal]'))) { const n = +el.dataset.cal, base = db.ui.cal || today().slice(0, 7); let ym = today().slice(0, 7); if (n) { const m = (+base.slice(5) - 1) + n, y = +base.slice(0, 4) + Math.floor(m / 12); ym = y + '-' + pad(((m % 12) + 12) % 12 + 1); } db.ui.cal = ym; save(); return render(); }
    if ((el = t.closest('[data-tab-go]'))) return go(el.dataset.tabGo);
    if ((el = t.closest('[data-mv]'))) { const o = db.ui.order, i = o.indexOf(el.dataset.k), j = i + (+el.dataset.mv); if (j >= 0 && j < o.length) { [o[i], o[j]] = [o[j], o[i]]; save(); render(); const nb = $(`[data-card="${el.dataset.k}"]`); if (nb) nb.scrollIntoView({ block: 'center', behavior: 'instant' }); } return; }
    if ((el = t.closest('[data-read]'))) { $$('.hit.sel').forEach(h => h.classList.remove('sel')); el.classList.add('sel'); const r = $('#chart-read'); if (r) r.textContent = el.dataset.read; return; }
    if ((el = t.closest('[data-act]'))) {
      const a = el.dataset.act;
      if (a === 'toggle-edit') { db.ui.edit = !db.ui.edit; return render(); }
      if (a === 'reset-layout') { db.ui.order = [...CARD_KEYS]; save(); return render(); }
      if (a === 'clock') return clock();
      if (a === 'discard') { if (confirm('Discard the running timer?')) { db.timer = null; save(); render(); } return; }
      if (a === 'sync') return syncNow(false);
      if (a === 'share') return shareFile();
      if (a === 'import') return $('#imp').click();
      if (a === 'clear') { if (confirm('Clear all data on this phone? Your PC is not changed.') && confirm('Last check: anything not yet synced will be lost.')) { const keep = { url: db.sync.url, code: db.sync.code }; db = newDB(); Object.assign(db.sync, keep); save(); render(); toast('Phone data cleared'); } return; }

}

}
